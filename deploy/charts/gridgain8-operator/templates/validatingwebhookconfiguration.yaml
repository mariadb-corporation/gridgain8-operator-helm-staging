{{- if not .Values.currentNamespaceOnly }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ .Values.validatingWebhook.name }}
  {{- if .Values.webhook.cert.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s" .Release.Namespace .Values.webhook.cert.certManager.servingCertificateName | quote }}
  {{- end }}
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: gridgain-k8s-operator-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-gridgain-gridgain-com-v1alpha1-gridgaincluster
    failurePolicy: Fail
    timeoutSeconds: 5
    name: vgridgaincluster-v1alpha1.kb.io
    rules:
      - apiGroups:
          - gridgain.gridgain.com
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - gridgainclusters
    sideEffects: None
{{- end }}
