{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gridgain-k8s-operator-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gridgain-k8s-operator.commonLabels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "gridgain-k8s-operator.selectorLabels" . | nindent 6 }}
{{- end }}
