                        format: date-time
                        type: string
                      message:
                        description: Message explains the failure.
                        type: string
                      stuckOrdinal:
                        description: StuckOrdinal is the StatefulSet pod ordinal that
                          timed out.
                        format: int32
                        type: integer
                      toRevision:
                        description: ToRevision is the target revision that failed.
                        type: string
                    type: object
                  lastRetryAt:
                    description: |-
                      LastRetryAt is when retryUntilReady last deleted the stuck pod; the next deletion
                      waits a capped exponential backoff from this instant regardless of reconcile cadence.
                    format: date-time
                    type: string
                  lastTransitionAt:
                    description: LastTransitionAt is when Phase last changed.
                    format: date-time
                    type: string
                  message:
                    description: Message carries human-readable progress or failure
                      text.
                    type: string
                  partition:
                    description: Partition is the StatefulSet rollingUpdate.partition
                      last applied by the operator.
                    format: int32
                    type: integer
                  phase:
                    description: Phase summarizes lifecycle (Idle, Pending, Rolling,
                      Retrying, Failed, Complete, RolledBack).
                    enum:
                    - Idle
                    - Pending
                    - Rolling
                    - Retrying
                    - Failed
                    - Complete
                    - RolledBack
                    type: string
                  recoveryToken:
                    description: RecoveryToken is copied into spec.upgrade.recovery.token
                      to acknowledge recovery.
                    type: string
                  retryCount:
                    description: RetryCount tracks retryUntilReady pod deletions on
                      the stuck ordinal.
                    format: int32
                    type: integer
                  rollingBack:
                    description: RollingBack is true while reverting workload to fromControllerRevision
                      (rollback action).
                    type: boolean
                  startedAt:
                    description: StartedAt is when the current upgrade attempt started.
                    format: date-time
                    type: string
                  stuckOrdinal:
                    description: StuckOrdinal is set when Phase is Failed or Retrying.
                    format: int32
                    type: integer
                  toRevision:
                    description: ToRevision is the desired pod template hash for this
                      upgrade.
                    type: string
                  waitingSince:
                    description: WaitingSince is when the operator started waiting
                      for the current ordinal to become Ready.
                    format: date-time
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
